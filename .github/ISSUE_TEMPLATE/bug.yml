name: Bug report
description: Report a reproducible problem in the iOS project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable set of steps.
    validations:
      required: true
  - type: input
    id: ios
    attributes:
      label: iOS version
      placeholder: "27.0"
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 12 mini"
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, or failing CI links when available.
