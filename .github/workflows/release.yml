name: Release Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-archive:
    name: Validate unsigned device archive
    runs-on: macos-26
    timeout-minutes: 30

    env:
      ARCHIVE_PATH: IOSFoundation.xcarchive

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Create unsigned archive
        run: |
          xcodebuild archive \
            -project IOSFoundation.xcodeproj \
            -scheme IOSFoundation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload short-lived archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-ios-archive
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 1

# Distribution signing and App Store/TestFlight upload intentionally remain disabled.
# They will be added only when Apple credentials are available through GitHub Secrets.
