name: Release Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-archive:
    name: Build SideStore-ready IPA
    runs-on: macos-26
    timeout-minutes: 30

    env:
      ARCHIVE_PATH: IOSFoundation.xcarchive
      IPA_PATH: ProofLedger.ipa

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      - name: Create unsigned device archive
        run: |
          xcodebuild archive \
            -project IOSFoundation.xcodeproj \
            -scheme IOSFoundation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package SideStore-ready IPA
        run: |
          set -euo pipefail
          app_path="$ARCHIVE_PATH/Products/Applications/IOSFoundation.app"
          info_plist="$app_path/Info.plist"
          test -d "$app_path"
          test -f "$info_plist"

          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info_plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName ProofLedger' "$info_plist"
          else
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string ProofLedger' "$info_plist"
          fi

          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$info_plist")"
          test "$display_name" = 'ProofLedger'

          rm -rf Payload "$IPA_PATH"
          mkdir Payload
          cp -R "$app_path" Payload/
          zip -qry "$IPA_PATH" Payload

          test -s "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -l "$IPA_PATH" | grep -q 'Payload/IOSFoundation.app/Info.plist'
          shasum -a 256 "$IPA_PATH"

      - name: Upload ProofLedger IPA
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ProofLedger-SideStore-IPA
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload short-lived archive
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unsigned-ios-archive
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 1

# SideStore performs personal-development signing on the iPhone.
# App Store/TestFlight signing remains intentionally disabled until Apple credentials are available.
