name: iOS 27 Forward Compatibility

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ios-27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-27:
    name: Xcode 27 preview · iPhone 12 mini
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 35

    env:
      RESULT_BUNDLE: iOS27.xcresult
      DERIVED_DATA: DerivedData-iOS27

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report preview toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Select iOS 27 compact simulator
        id: simulator
        shell: bash
        run: echo "destination=$(scripts/ci/select-simulator.sh '27.0' 'iPhone 12 mini')" >> "$GITHUB_OUTPUT"

      - name: Run full test suite against iOS 27
        run: |
          xcodebuild test \
            -project IOSFoundation.xcodeproj \
            -scheme IOSFoundation \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload preview diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-27-preview-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 7
          if-no-files-found: ignore
