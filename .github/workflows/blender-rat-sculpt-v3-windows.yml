name: Blender Rat Sculpt V3 Windows

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/blender-rat-sculpt-v3-windows.yml'

permissions:
  actions: read
  contents: read

jobs:
  sculpt-v3-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated refinement-pass-2 Blender asset
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: rajalarata/ios
          run-id: 33322128755
          name: blender-rat-production-step1
          path: out

      - name: Verify red gate against pass 2
        shell: pwsh
        run: |
          python experiments/remotion-rat-blender/validate_sculpt_v3.py out/rat-production-manifest.json
          $code = $LASTEXITCODE
          if ($code -eq 0) { throw 'Expected pass-2 asset to fail sculpt-v3 gate.' }
          Write-Host "RED gate confirmed with expected validator exit code $code."
          exit 0

      - name: Download Blender 4.5.13 LTS
        shell: pwsh
        run: |
          $url = 'https://download.blender.org/release/Blender4.5/blender-4.5.13-windows-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile blender.zip
          Expand-Archive blender.zip -DestinationPath blender-dist
          $exe = Get-ChildItem blender-dist -Recurse -Filter blender.exe | Select-Object -First 1
          if (-not $exe) { throw 'blender.exe not found' }
          $exe.FullName | Out-File -FilePath blender-path.txt -Encoding ascii
          & $exe.FullName --version

      - name: Refine sculpt v3 in Blender
        shell: pwsh
        run: |
          $blender = (Get-Content blender-path.txt).Trim()
          $out = (Resolve-Path out).Path
          & $blender -b out/rat-production.blend --python experiments/remotion-rat-blender/refine_rat_v3.py -- --out $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify green sculpt gate
        shell: pwsh
        run: |
          python experiments/remotion-rat-blender/validate_sculpt_v3.py out/rat-production-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate outputs
        shell: pwsh
        run: |
          $files = @(
            'out/rat-production-v3.blend',
            'out/rat-production-v3.glb',
            'out/rat-v3-front.png',
            'out/rat-v3-three-quarter.png',
            'out/rat-v3-side.png',
            'out/rat-v3-back.png',
            'out/rat-v3-face.png',
            'out/rat-v3-hero.png'
          )
          foreach ($f in $files) {
            if (!(Test-Path $f) -or (Get-Item $f).Length -eq 0) { throw "Missing/empty $f" }
          }
          Get-Content out/rat-production-manifest.json

      - name: Upload sculpt v3 asset
        uses: actions/upload-artifact@v4
        with:
          name: blender-rat-sculpt-v3-windows
          path: |
            out/rat-production-v3.blend
            out/rat-production-v3.glb
            out/rat-production-manifest.json
            out/rat-v3-front.png
            out/rat-v3-three-quarter.png
            out/rat-v3-side.png
            out/rat-v3-back.png
            out/rat-v3-face.png
            out/rat-v3-hero.png
          if-no-files-found: error
          retention-days: 14
