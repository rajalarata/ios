name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: IOSFoundation.xcodeproj
  SCHEME: IOSFoundation
  XCODE_PATH: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  quality:
    name: Quality gates
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          swift --version
          swiftformat --version

      - name: Ensure SwiftLint 0.65.1
        shell: bash
        run: |
          set -euo pipefail
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint version
            exit 0
          fi

          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          destination="$RUNNER_TEMP/swiftlint"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$archive"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $archive" | shasum -a 256 --check
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          swiftlint_bin="$(find "$destination" -type f -name swiftlint | head -n 1)"
          if [[ -z "$swiftlint_bin" ]]; then
            echo "SwiftLint executable not found in verified archive." >&2
            exit 1
          fi
          chmod +x "$swiftlint_bin"
          echo "$(dirname "$swiftlint_bin")" >> "$GITHUB_PATH"
          "$swiftlint_bin" version

      - name: Check Swift formatting
        run: swiftformat IOSFoundation IOSFoundationTests IOSFoundationUITests --lint --config .swiftformat

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(p12|cer|mobileprovision|provisionprofile|pem|key)$'; then
            echo "Signing or key material must not be committed." >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "Environment secret files must not be committed." >&2
            exit 1
          fi

  unit-tests:
    name: Unit tests · iOS ${{ matrix.runtime }}
    needs: quality
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - "26.2"
          - "26.5"

    env:
      RESULT_BUNDLE: UnitTests-${{ matrix.runtime }}.xcresult
      DERIVED_DATA: DerivedData-Unit-${{ matrix.runtime }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: Restore Swift package cache when dependencies exist
        if: ${{ hashFiles('**/Package.resolved') != '' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}

      - name: Select simulator
        id: simulator
        shell: bash
        run: echo "destination=$(scripts/ci/select-simulator.sh '${{ matrix.runtime }}')" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -enableCodeCoverage YES \
            -only-testing:IOSFoundationTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Add coverage summary
        if: success()
        run: scripts/ci/coverage-summary.sh "$RESULT_BUNDLE"

      - name: Upload failed unit-test diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-tests-ios-${{ matrix.runtime }}-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    name: UI and accessibility smoke tests · iPhone 12 mini
    needs: quality
    runs-on: macos-26
    timeout-minutes: 30

    env:
      RESULT_BUNDLE: UITests.xcresult
      DERIVED_DATA: DerivedData-UI

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: Select compact simulator
        id: simulator
        shell: bash
        run: echo "destination=$(scripts/ci/select-simulator.sh '26.5' 'iPhone 12 mini')" >> "$GITHUB_OUTPUT"

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -only-testing:IOSFoundationUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed UI-test diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ui-tests-iphone-12-mini-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 7
          if-no-files-found: ignore

  release-build:
    name: Release simulator build
    needs: quality
    runs-on: macos-26
    timeout-minutes: 20

    env:
      RESULT_BUNDLE: ReleaseBuild.xcresult
      DERIVED_DATA: DerivedData-Release

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: Build release configuration
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload failed release-build diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-build-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 7
          if-no-files-found: ignore
